<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chaos Descent</title>
<style>
:root{--bg:#e9e4f5;--fg:#1d1733;--ac:#c2255c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100d1c;--fg:#ece6ff;--ac:#ff6b9d}}
:root[data-theme="dark"]{--bg:#100d1c;--fg:#ece6ff;--ac:#ff6b9d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 "Trebuchet MS",Verdana,sans-serif;padding:12px}
#st{position:relative;max-width:820px;margin:0 auto}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#1b1830}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(12,9,24,.86);color:#fff;border-radius:10px;overflow:auto;padding:12px;text-align:center}
h1{font:900 clamp(28px,7vw,52px) Impact,"Arial Black",sans-serif;margin:0;letter-spacing:2px;color:#ff6b9d}h2{margin:0}p{margin:0}
button{font:inherit;cursor:pointer;border:2px solid #6b5fa8;background:#2a2545;color:#fff;border-radius:8px;padding:6px 12px}
button:focus-visible{outline:3px solid #ffd43b}button.on{background:#c2255c;border-color:#ff8fb3}
.big{font-size:20px;padding:10px 28px;background:#e8590c;border-color:#ffa94d}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.card{width:170px;display:flex;flex-direction:column;gap:4px;padding:12px;border-width:3px}
.card i{font-size:12px}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
small{opacity:.8}.code{font:900 48px Impact,sans-serif;letter-spacing:10px;color:#ffd43b}input{font:inherit;padding:6px 10px;border-radius:8px;border:2px solid #6b5fa8;background:#1d1933;color:#fff;width:130px}.pl{display:flex;gap:14px;align-items:center;justify-content:space-between;min-width:280px;padding:4px 10px;border-radius:8px;background:#2a2545}#err{color:#ff8787;min-height:1.2em}.note{max-width:820px;margin:8px auto 0;font-size:13px;opacity:.8}
</style></head><body>
<div id="st"><canvas id="c" width="800" height="500"></canvas><div id="ov"></div></div>
<p class="note">P1: WASD + Space. P2: arrows + Enter. Auto-aim, auto-fire. Needs a keyboard. Online: host runs the game, friends join with the room code. Standing next to a downed friend revives them.</p>
<script src="/socket.io/socket.io.js"></script>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),ov=document.getElementById('ov'),W=800,H=500;
const R=(a,b)=>a+Math.random()*(b-a),P=a=>a[Math.random()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(/Space|Arrow/.test(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);
const CT=[{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',a:'Space'},{u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',a:'Enter'}];
let net=null,NM='Player'+(10+Math.random()*89|0);
const kf=c=>({u:keys[c.u],d:keys[c.d],l:keys[c.l],r:keys[c.r],a:keys[c.a]});
const myKeys=()=>{const a=kf(CT[0]),b=kf(CT[1]);return{u:a.u||b.u,d:a.d||b.d,l:a.l||b.l,r:a.r||b.r,a:a.a||b.a}};
const enc=k=>(k.u?1:0)|(k.d?2:0)|(k.l?4:0)|(k.r?8:0)|(k.a?16:0),dec=m=>({u:m&1,d:m&2,l:m&4,r:m&8,a:m&16});
const inp=p=>!net||!net.live?kf(CT[p.id]):p.id===net.slot?myKeys():dec(net.inputs[p.id]||0);
function ovHide(){ov.style.display='none';if(net&&net.live&&net.host)net.sock.emit('h2p',{to:'all',t:'ovoff'})}
function shareOv(){if(net&&net.live&&net.host)net.sock.emit('h2p',{to:'all',t:'ov',d:ov.innerHTML})}
const CL={Tank:{hp:160,sp:2.2,col:'#4dabf7',cd:5,ab:'Shield Bash'},Wizard:{hp:85,sp:2.6,col:'#b197fc',cd:6,ab:'Spell Storm'},Trickster:{hp:95,sp:3.1,col:'#69db7c',cd:3,ab:'Teleport'},Engineer:{hp:105,sp:2.5,col:'#ffa94d',cd:8,ab:'Turret'}};
const RN=['Common','Uncommon','Rare','Epic','Legendary','Cursed'],RC=['#adb5bd','#51cf66','#4dabf7','#cc5de8','#ffd43b','#ff6b6b'];
const U=[['Sharp Stuff','+25% damage',0,p=>p.dmg*=1.25],['Caffeine','+20% attack speed',0,p=>p.rate/=1.2],['Running Shoes','+15% move speed',0,p=>p.sp*=1.15],['Thick Skin','+30 max HP',0,p=>{p.max+=30;p.hp+=30}],['Long Barrel','+70 range',0,p=>p.range+=70],
['Vampire Teeth','Heal when you hit',1,p=>p.life+=.06],['Lucky Clover','Better upgrades, +5% crit',1,p=>{p.luck++;p.crit+=.05}],['Big Shove','Hits knock enemies back',1,p=>p.knock++],['Time Skip','-30% ability cooldown',1,p=>p.cdm*=.7],['Crit Lover','+15% crit chance',1,p=>p.crit+=.15],
['Double Trouble','+1 projectile',2,p=>p.multi++],['Thunder Addiction','Every few hits: chain lightning',2,p=>p.chain++],['Piercing Shots','Shots pierce +1',2,p=>p.pierce++],['Capitalism','Coins give a speed burst',2,p=>p.capi++],
['Unstable Personality','Hits may explode',3,p=>p.boom++],['Gold Fever','+1% damage per 10 coins',3,p=>p.fever++],['Chaos Heart','+1 lightning, +1 explosion, +1 projectile',4,p=>{p.chain++;p.boom++;p.multi++}]];
const CU=[['Glass Cannon','+80% damage, -35% max HP',5,p=>{p.dmg*=1.8;p.max*=.65;p.hp=Math.min(p.hp,p.max)}],['Heavy Crown','+100% damage, -30% speed',5,p=>{p.dmg*=2;p.sp*=.7}],['Cursed Tax','+60% attack speed, lose half your coins',5,p=>{p.rate/=1.6;G.coins>>=1}],['Paper Armor','+2 projectiles, take 40% more damage',5,p=>{p.multi+=2;p.dtm*=1.4}]];
const EVS=[['Big Head Mode','Everyone has an enormous head'],['Tiny Mode','Everyone is tiny and quick'],['Greed Is Good','Coins x2, enemies tougher'],['Floor Is Lava','Watch the red circles'],['Gravity Failure','Gravity keeps shoving you'],['Everyone Is A Wizard','Free spell storms'],['Friendly Fire','Your shots hurt teammates'],['Tax Day','A taxman takes 20% of your coins']];
const ET={grunt:[22,1.1,11,'#ff8787'],runner:[12,2.1,8,'#ffd43b'],brute:[70,.7,16,'#845ef7'],shooter:[18,.7,10,'#63e6be'],chick:[10,1.8,7,'#fff3bf']};
const BN=['Tax Collector','Chicken Overlord','Mimic King','Unstable Wizard'];
let G=null,np=1,sel=['Tank','Wizard'];
function offers(p,m){if(m==='c')return CU.slice().sort(()=>Math.random()-.5).slice(0,3);const L=p.luck+(m==='t'?4:0),w=r=>[50,30,14+L*3,5+L*2,.6+L*.7][r],o=[];
while(o.length<3){const pool=U.filter(u=>!o.includes(u));let x=Math.random()*pool.reduce((s,u)=>s+w(u[2]),0),k=pool[0];for(const u of pool){k=u;x-=w(u[2]);if(x<=0)break}o.push(k)}return o}
function menu(){G=null;ov.style.display='flex';ov.innerHTML=`<h1>CHAOS DESCENT</h1><p>One dungeon. Eight idiots. Infinite bad decisions.</p><div class=row>Players: <button class="tg ${np==1?'on':''}" data-n=1>1</button><button class="tg ${np==2?'on':''}" data-n=2>2, same keyboard</button></div>`+[0,1].slice(0,np).map(i=>`<div class=row>P${i+1}: ${Object.keys(CL).map(c=>`<button class="cs ${sel[i]==c?'on':''}" data-p=${i} data-c=${c}>${c}</button>`).join('')}</div>`).join('')+`<small>${[0,1].slice(0,np).map(i=>`P${i+1} ability: ${CL[sel[i]].ab}`).join(' | ')}</small><button id=go class=big>Play local</button><hr style="width:60%;opacity:.3"><div class=row>Online: <input id=nm maxlength=12 placeholder=Name value="${NM}"><button id=cr>Create room</button></div><div class=row><input id=cd maxlength=4 placeholder=CODE style="text-transform:uppercase"><button id=jn>Join</button></div><div id=err></div>`;
ov.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{np=+b.dataset.n;menu()});ov.querySelectorAll('.cs').forEach(b=>b.onclick=()=>{sel[b.dataset.p]=b.dataset.c;menu()});document.getElementById('go').onclick=()=>start(sel.slice(0,np).map((c,i)=>({cls:c,name:'P'+(i+1)})));document.getElementById('cr').onclick=()=>goOnline('create');document.getElementById('jn').onclick=()=>goOnline('join')}
function start(list){ovHide();const ps=[];for(let i=0;i<list.length;i++){const c=CL[list[i].cls];ps.push({id:i,name:list[i].name,cls:list[i].cls,col:c.col,x:W/2,y:H-60,hp:c.hp,max:c.hp,sp:c.sp,dmg:10,rate:30,range:230,crit:.05,multi:1,pierce:0,knock:0,boom:0,chain:0,life:0,capi:0,luck:0,fever:0,cdm:1,dtm:1,cd:0,ft:0,inv:0,boost:0,hits:0,kx:0,ky:0,dx:0,dy:-1,r:12,down:false,gone:false,rev:0,items:[]})}
G={ps,floor:1,room:0,coins:0,score:0,tick:0,state:'play',en:[],bu:[],eb:[],co:[],tu:[],fx:[],lava:[],q:[],ev:null,wait:0,ban:'',banT:0};nextRoom()}
function say(t,n=160){G.ban=t;G.banT=n}
function setEv(e){G.ev={n:e[0]};say(e[0]+': '+e[1],200);if(e[0]==='Tax Day')G.coins=Math.floor(G.coins*.8)}
function nextRoom(){G.room++;G.ev=null;G.en=[];G.bu=[];G.eb=[];G.co=[];G.tu=[];G.lava=[];G.q=[];G.cleared=0;
G.ps.forEach(p=>{p.x=W/2+(p.id-(G.ps.length-1)/2)*40;p.y=H-60;if(p.down&&!p.gone){p.down=false;p.hp=p.max*.4}});
const boss=G.room>=4;let t='combat';if(!boss&&G.room>1){const r=Math.random();t=r<.14?'heal':r<.26?'cursed':r<.38?'treasure':'combat'}
G.type=boss?'boss':t;
if(t==='heal'&&!boss){G.ps.forEach(p=>p.hp=Math.min(p.max,p.hp+p.max*.6));say('Healing room. Breathe.');G.wait=110;return}
if(t==='treasure'&&!boss){G.coins+=15;say('Treasure room!');return pickFor('t')}
if(t==='cursed'&&!boss){say('Cursed room...');return pickFor('c')}
if(Math.random()<.65)setEv(P(EVS));else say(boss?'Floor '+G.floor+' boss':'Room '+G.room);
const n=G.ps.length;G.sc=(1+.25*(G.floor-1)+.05*G.room)*(1+.35*(n-1))*(G.ev&&G.ev.n==='Greed Is Good'?1.5:1);
if(boss){spawnBoss()}else{const c=Math.round((5+G.floor*2+G.room*2)*(1+.6*(n-1)));for(let i=0;i<c;i++){const r=Math.random();G.q.push(r<.25&&G.room>1?'shooter':r<.4&&(G.floor>1||G.room>2)?'brute':r<.6?'runner':'grunt')}}}
function mk(t,x,y,s){const[h,sp,r,c]=ET[t];return{t,x,y,hp:h*s,max:h*s,sp,r,col:c,cd:60,kx:0,ky:0,fl:0}}
function spawnBoss(){const n=BN[(G.floor-1)%4],h=500*G.floor*(1+.6*(G.ps.length-1));G.en.push({t:'boss',bn:n,x:W/2,y:90,hp:h,max:h,sp:.55,r:34,col:'#e03131',cd:150,kx:0,ky:0,fl:0,sleep:n==='Mimic King'?150:0});say(n+' appears!',200)}
function edge(){const s=Math.random()*4|0;return s<1?[R(0,W),0]:s<2?[R(0,W),H]:s<3?[0,R(0,H)]:[W,R(0,H)]}
function pickFor(m){G.state='pick';G.pq=G.ps.filter(p=>!p.down&&!p.gone);G.pm=m;showPick()}
function showPick(){const p=G.pq[0];if(!p){ovHide();G.state='play';return nextRoom()}
const os=G.os=offers(p,G.pm),h=`<h2 style="color:${p.col}">${p.name} the ${p.cls}: pick ${G.pm==='c'?'a cursed ':'an '}upgrade</h2><small>Coins: ${G.coins}</small><div class=cards>`+os.map((u,i)=>`<button class=card data-i=${i} style="border-color:${RC[u[2]]}"><b>${u[0]}</b><i style="color:${RC[u[2]]}">${RN[u[2]]}</i><span>${u[1]}</span></button>`).join('')+'</div>',live=net&&net.live,w=`<h2>Waiting for ${p.name}...</h2><small>Picking an upgrade</small>`;
if(live){net.sock.emit('h2p',{to:'all',t:'ov',d:w});if(p.id!==net.slot){net.sock.emit('h2p',{to:p.id,t:'ov',d:h});ov.style.display='flex';ov.innerHTML=w;return}}
ov.style.display='flex';ov.innerHTML=h;ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}
function choose(i){const p=G.pq[0],u=G.os&&G.os[i];if(!p||!u)return;u[3](p);p.items.push(u[0]);G.pq.shift();showPick()}
function clearRoom(){if(G.type==='boss'){G.state='pick';G.score+=300*G.floor;ov.style.display='flex';ov.innerHTML=`<h2>Floor ${G.floor} cleared!</h2><p>Coins: ${G.coins}. Score: ${G.score}</p><p>Leave with your loot, or risk a harder floor.</p><div class=row data-host><button id=ex>Extract (+${G.coins*5} score)</button><button id=ds class=big>Descend</button></div>`;
shareOv();document.getElementById('ex').onclick=()=>end(true);document.getElementById('ds').onclick=()=>{G.floor++;G.room=0;G.ps.forEach(p=>p.hp=Math.min(p.max,p.hp+p.max*.3));ovHide();G.state='play';nextRoom()}}else pickFor('n')}
function end(win){const s=G.score+(win?G.coins*5:0);G.state='over';ov.style.display='flex';ov.innerHTML=`<h2>${win?'Extracted with loot!':'Everyone is down.'}</h2><p>Floor ${G.floor}, room ${G.room}. Final score: ${s}</p><p>Upgrades: ${G.ps.map(p=>p.name+' '+(p.items.join(', ')||'none')).join(' / ')}</p><div data-host><button class=big id=ag>Back</button></div>`;shareOv();document.getElementById('ag').onclick=()=>net&&net.live?net.sock.emit('toLobby'):menu()}
function dmg(p,d){if(p.inv>0||p.down)return;p.hp-=d*p.dtm;p.inv=30;if(p.hp<=0){p.hp=0;p.down=true;p.rev=0;say(p.name+' is down! Revive them.',120)}}
function hurt(e,d,p){if(e.dead||e.sleep>0)return;e.hp-=d;e.fl=4;if(p&&p.life)p.hp=Math.min(p.max,p.hp+d*p.life);if(e.hp<=0){e.dead=1;const b=e.t==='boss',v=G.ev&&G.ev.n==='Greed Is Good'?2:1;for(let i=0;i<(b?25:1+(Math.random()<.3));i++)G.co.push({x:e.x+R(-15,15),y:e.y+R(-15,15),v});G.score+=b?500:10}}
function boom(x,y,r,d,k,p){G.fx.push({x,y,r,t:14,c:'#ff922b'});for(const e of G.en){const dd=Math.hypot(e.x-x,e.y-y);if(dd<r+e.r){hurt(e,d,p);const f=(3+k*4)*(e.t==='boss'?.2:1)/(dd||1);e.kx+=(e.x-x)*f;e.ky+=(e.y-y)*f}}}
function chain(e,p,d){const t=G.en.filter(o=>o!==e&&!o.dead&&D(o,e)<140).slice(0,3+p.chain);let f=e;for(const o of t){G.fx.push({x:f.x,y:f.y,x2:o.x,y2:o.y,t:8,c:'#ffe066'});hurt(o,d*.8,p);f=o}}
function nearest(a,o,m=1e9){let b=null,bd=m;for(const e of a){if(e.dead||e.down)continue;const d=D(e,o);if(d<bd){bd=d;b=e}}return b}
function fire(p){const t=nearest(G.en,p,p.range);if(!t)return;const a=Math.atan2(t.y-p.y,t.x-p.x);for(let i=0;i<p.multi;i++){const q=a+(i-(p.multi-1)/2)*.2;G.bu.push({x:p.x,y:p.y,vx:Math.cos(q)*7,vy:Math.sin(q)*7,p,life:p.range/7+5,pi:p.pierce,hit:new Set()})}p.ft=p.rate}
function onHit(p,e,b){const cr=Math.random()<p.crit,d=p.dmg*(1+p.fever*.01*(G.coins/10|0))*(cr?2:1);hurt(e,d,p);const k=(e.t==='boss'?.2:1)*(1.2+p.knock*3);e.kx+=b.vx/7*k;e.ky+=b.vy/7*k;p.hits++;
if(p.chain&&p.hits%Math.max(2,6-p.chain)==0)chain(e,p,d);if(p.boom&&Math.random()<.08*p.boom)boom(e.x,e.y,55+p.knock*12,d*.8,p.knock,p)}
function ability(p){if(p.cd>0)return;const c=p.cls;
if(c==='Tank'){boom(p.x,p.y,130,p.dmg*3,p.knock+2,p);p.inv=60}
else if(c==='Wizard')nova(p);
else if(c==='Trickster'){p.x=cl(p.x+p.dx*150,15,W-15);p.y=cl(p.y+p.dy*150,15,H-15);p.inv=25;G.fx.push({x:p.x,y:p.y,r:30,t:10,c:'#69db7c'})}
else G.tu.push({x:p.x,y:p.y,life:700,cd:0,p});
p.cd=CL[c].cd*60*p.cdm}
function nova(p){const t=G.en.filter(e=>!e.dead);for(let i=0;i<3;i++){const e=t.length?P(t):{x:R(100,W-100),y:R(100,H-100)};boom(e.x+R(-20,20),e.y+R(-20,20),75,p.dmg*3,p.knock,p)}}
function update(){const ps=G.ps,al=ps.filter(p=>!p.down),ev=G.ev&&G.ev.n;G.tick++;if(G.banT>0)G.banT--;
if(G.wait>0&&--G.wait==0)return nextRoom();
if(G.q.length&&G.tick%22==0){const[x,y]=edge();G.en.push(mk(G.q.pop(),x,y,G.sc))}
for(const p of ps){if(p.gone)continue;if(p.down){for(const q of al)if(D(p,q)<45)p.rev+=1/120;if(p.rev>=1){p.down=false;p.hp=p.max*.5;p.inv=90}continue}
const k=inp(p);let dx=(k.r?1:0)-(k.l?1:0),dy=(k.d?1:0)-(k.u?1:0);const m=Math.hypot(dx,dy);if(m){dx/=m;dy/=m;p.dx=dx;p.dy=dy}
const sp=p.sp*(ev==='Tiny Mode'?1.2:1)*(p.boost>0?1.5:1);p.r=12*(ev==='Big Head Mode'?1.7:ev==='Tiny Mode'?.6:1);
p.x=cl(p.x+dx*sp+p.kx,p.r,W-p.r);p.y=cl(p.y+dy*sp+p.ky,p.r,H-p.r);p.kx*=.88;p.ky*=.88;p.boost--;p.inv--;p.cd--;p.ft--;
if(k.a)ability(p);if(p.ft<=0)fire(p);if(ev==='Everyone Is A Wizard'&&G.tick%300==0)nova(p)}
if(ev==='Gravity Failure'&&G.tick%180==0){ps.forEach(p=>{p.kx+=R(-9,9);p.ky+=R(-9,9)});G.en.forEach(e=>{e.kx+=R(-9,9);e.ky+=R(-9,9)})}
if(ev==='Floor Is Lava'&&G.tick%200==0)for(let i=0;i<3;i++)G.lava.push({x:R(60,W-60),y:R(60,H-60),t:0});
for(const l of G.lava){l.t++;if(l.t==75)for(const p of al)if(D(p,l)<55+p.r)dmg(p,18)}G.lava=G.lava.filter(l=>l.t<95);
for(const e of G.en){if(e.dead)continue;e.fl--;const t=nearest(al,e);if(!t)continue;if(e.sleep>0){e.sleep--;continue}
const d=D(t,e)||1;let ux=(t.x-e.x)/d,uy=(t.y-e.y)/d;
if(e.t==='shooter'){if(d<180){ux=-ux;uy=-uy}else if(d<260){ux=0;uy=0}if(--e.cd<=0){e.cd=110;G.eb.push({x:e.x,y:e.y,vx:(t.x-e.x)/d*2.6,vy:(t.y-e.y)/d*2.6,life:200})}}
e.x=cl(e.x+ux*e.sp+e.kx,e.r,W-e.r);e.y=cl(e.y+uy*e.sp+e.ky,e.r,H-e.r);e.kx*=.85;e.ky*=.85;
if(e.t==='boss'&&--e.cd<=0){e.cd=240;const s=G.sc||1;if(e.bn==='Chicken Overlord')for(let i=0;i<5;i++)G.en.push(mk('chick',e.x+R(-30,30),e.y+R(-30,30),s));
else if(e.bn==='Tax Collector')for(let i=0;i<3;i++)G.en.push(mk('grunt',e.x+R(-30,30),e.y+R(-30,30),s));
else if(e.bn==='Mimic King')for(let i=0;i<3;i++)G.en.push(mk('runner',e.x+R(-30,30),e.y+R(-30,30),s));
else{setEv(P(EVS));G.en.push(mk('shooter',e.x,e.y,s),mk('shooter',e.x,e.y,s))}}
for(const p of al)if(D(p,e)<e.r+p.r){dmg(p,8*(1+.15*(G.floor-1))*(e.t==='boss'?2:1));if(e.bn==='Tax Collector')G.coins=Math.max(0,G.coins-15)}}
for(const b of G.bu){b.x+=b.vx;b.y+=b.vy;b.life--;
for(const e of G.en){if(e.dead||b.life<=0||b.hit.has(e)||e.sleep>0)continue;if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){b.hit.add(e);onHit(b.p,e,b);if(b.pi--<=0)b.life=0}}
if(ev==='Friendly Fire')for(const q of al)if(q!==b.p&&b.life>0&&Math.hypot(q.x-b.x,q.y-b.y)<q.r+4){dmg(q,6);b.life=0}}
G.bu=G.bu.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
for(const b of G.eb){b.x+=b.vx;b.y+=b.vy;b.life--;for(const p of al)if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+4){dmg(p,8);b.life=0}}G.eb=G.eb.filter(b=>b.life>0);
for(const t of G.tu){t.life--;if(--t.cd<=0){const e=nearest(G.en,t,260);if(e){const a=Math.atan2(e.y-t.y,e.x-t.x);G.bu.push({x:t.x,y:t.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,p:t.p,life:40,pi:0,hit:new Set()});t.cd=18}}}G.tu=G.tu.filter(t=>t.life>0);
for(const c of G.co){const p=nearest(al,c,90);if(p){const d=D(p,c)||1;c.x+=(p.x-c.x)/d*4;c.y+=(p.y-c.y)/d*4;if(d<p.r+8){c.g=1;G.coins+=c.v;G.score+=c.v;if(p.capi)p.boost=90*p.capi}}}G.co=G.co.filter(c=>!c.g);
for(const f of G.fx)f.t--;G.fx=G.fx.filter(f=>f.t>0);G.en=G.en.filter(e=>!e.dead);
if(!al.length)return end(false);
if((G.type==='combat'||G.type==='boss')&&!G.cleared&&!G.q.length&&!G.en.length){G.cleared=1;setTimeout(()=>G.state==='play'&&clearRoom(),600)}}
function bar(x,y,w,v,c){X.fillStyle='#0008';X.fillRect(x,y,w,7);X.fillStyle=c;X.fillRect(x,y,w*cl(v,0,1),7)}
function draw(){X.fillStyle='#1b1830';X.fillRect(0,0,W,H);X.strokeStyle='#262142';X.lineWidth=1;for(let i=0;i<W;i+=50){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.stroke()}for(let i=0;i<H;i+=50){X.beginPath();X.moveTo(0,i);X.lineTo(W,i);X.stroke()}
if(!G)return;
for(const l of G.lava){X.fillStyle=l.t<75?'rgba(255,60,60,.25)':'rgba(255,120,30,.7)';X.beginPath();X.arc(l.x,l.y,55,0,7);X.fill()}
X.fillStyle='#ffd43b';for(const c of G.co){X.beginPath();X.arc(c.x,c.y,4,0,7);X.fill()}
for(const t of G.tu){X.fillStyle='#ffa94d';X.fillRect(t.x-8,t.y-8,16,16)}
for(const e of G.en){X.fillStyle=e.fl>0?'#fff':e.col;if(e.sleep>0){X.fillStyle='#b8860b';X.fillRect(e.x-30,e.y-20,60,40);X.fillStyle='#ffd43b';X.fillRect(e.x-6,e.y-4,12,10);continue}
X.beginPath();X.arc(e.x,e.y,e.r,0,7);X.fill();X.fillStyle='#000';X.fillRect(e.x-e.r*.45,e.y-e.r*.3,e.r*.25,e.r*.3);X.fillRect(e.x+e.r*.2,e.y-e.r*.3,e.r*.25,e.r*.3);
if(e.t==='boss'){X.fillStyle='#ffd43b';X.fillRect(e.x-20,e.y-e.r-10,40,10);bar(W/2-150,H-22,300,e.hp/e.max,'#e03131');X.fillStyle='#fff';X.font='12px sans-serif';X.textAlign='center';X.fillText(e.bn,W/2,H-26)}else if(e.hp<e.max)bar(e.x-10,e.y-e.r-8,20,e.hp/e.max,'#ff6b6b')}
X.fillStyle='#ff8787';for(const b of G.eb){X.beginPath();X.arc(b.x,b.y,4,0,7);X.fill()}
for(const b of G.bu){X.fillStyle=b.c||b.p.col;X.beginPath();X.arc(b.x,b.y,4,0,7);X.fill()}
for(const f of G.fx){X.strokeStyle=f.c;X.lineWidth=3;X.beginPath();if(f.x2!=null){X.moveTo(f.x,f.y);X.lineTo(f.x2,f.y2)}else X.arc(f.x,f.y,f.r*(1-f.t/16),0,7);X.stroke()}
for(const p of G.ps){X.globalAlpha=p.down?.4:p.inv>0&&G.tick%6<3?.5:1;X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill();X.fillStyle='#000';X.fillRect(p.x-p.r*.4,p.y-p.r*.25,p.r*.2,p.r*.3);X.fillRect(p.x+p.r*.2,p.y-p.r*.25,p.r*.2,p.r*.3);X.globalAlpha=1;if(p.down)bar(p.x-14,p.y-p.r-10,28,p.rev,'#69db7c')}
X.font='bold 12px sans-serif';X.textAlign='left';G.ps.forEach((p,i)=>{const y=10+i*40;X.fillStyle='#fff';X.fillText(`${p.name||'P'+(i+1)} ${p.cls}`,10,y+9);bar(10,y+14,120,p.hp/p.max,p.col);bar(10,y+24,120,1-Math.max(0,p.cd)/(CL[p.cls].cd*60*p.cdm),'#ffd43b')});
X.textAlign='right';X.fillStyle='#fff';X.fillText(`Floor ${G.floor}  Room ${Math.min(G.room,4)}/4  Coins ${G.coins}  Score ${G.score}`,W-10,20);
if(G.ev){X.fillStyle='#ff6b9d';X.fillText(G.ev.n,W-10,38)}
X.textAlign='center';if(G.banT>0){X.globalAlpha=Math.min(1,G.banT/30);X.fillStyle='#fff';X.font='bold 22px sans-serif';X.fillText(G.ban,W/2,70);X.globalAlpha=1}}
const rn=Math.round;
function snap(){return{ps:G.ps.map(p=>({id:p.id,name:p.name,cls:p.cls,col:p.col,x:rn(p.x),y:rn(p.y),hp:rn(p.hp),max:rn(p.max),r:p.r,down:p.down,rev:+p.rev.toFixed(2),inv:p.inv,cd:rn(p.cd),cdm:p.cdm})),
en:G.en.map(e=>({t:e.t,x:rn(e.x),y:rn(e.y),r:e.r,col:e.col,fl:e.fl,hp:rn(e.hp),max:rn(e.max),sleep:e.sleep,bn:e.bn})),bu:G.bu.map(b=>({x:rn(b.x),y:rn(b.y),c:b.p.col})),eb:G.eb.map(b=>({x:rn(b.x),y:rn(b.y)})),co:G.co.map(c=>({x:rn(c.x),y:rn(c.y)})),tu:G.tu.map(t=>({x:t.x,y:t.y})),
fx:G.fx.map(f=>({x:rn(f.x),y:rn(f.y),r:f.r,t:f.t,c:f.c,x2:f.x2==null?null:rn(f.x2),y2:f.y2==null?null:rn(f.y2)})),lava:G.lava.map(l=>({x:rn(l.x),y:rn(l.y),t:l.t})),ev:G.ev,ban:G.ban,banT:G.banT,floor:G.floor,room:G.room,coins:G.coins,score:G.score,tick:G.tick}}
function safe(h){const d=new DOMParser().parseFromString(h,'text/html');d.body.querySelectorAll('*').forEach(e=>{if(!/^(H2|SMALL|DIV|BUTTON|SPAN|I|B|P)$/.test(e.tagName))return e.remove();[...e.attributes].forEach(a=>{if(!/^(class|style|data-i|data-host)$/.test(a.name))e.removeAttribute(a.name)})});return d.body.innerHTML}
const errMsg=m=>{const e=document.getElementById('err');if(e)e.textContent=m};
function goOnline(mode){const nm=(document.getElementById('nm').value||NM).trim().slice(0,12)||NM,code=document.getElementById('cd').value.trim().toUpperCase();NM=nm;
if(mode==='join'&&code.length!==4)return errMsg('Room code has 4 letters.');
if(!window.io)return errMsg('Online needs the server. Open the game from your Fly URL.');
conn();net.sock.emit(mode,{name:nm,code},r=>{if(!r||r.err){const m=r&&r.err;net.sock.close();net=null;return errMsg(m||'No answer.')}net.id=r.id;net.code=r.code})}
function conn(){if(net)return;const s=io({transports:['websocket']});net={sock:s,inputs:{},host:false,live:false,slot:0,lobby:null,id:''};
s.on('connect_error',()=>{if(net&&!net.id){net=null;errMsg('Cannot reach server.')}});
s.on('lobby',d=>{net.lobby=d;if(!net.live)lobbyUI()});
s.on('started',d=>{net.live=true;net.slot=d.you;net.host=d.you===0;net.inputs={};if(net.host)start(d.players);else{G={ps:[]};ov.style.display='none'}});
s.on('input',d=>{net.inputs[d.slot]=d.k});
s.on('snap',d=>{if(net&&!net.host)G=d});
s.on('h2p',m=>{if(m.t==='ov'&&typeof m.d==='string'){ov.style.display='flex';ov.innerHTML=safe(m.d);ov.querySelectorAll('[data-host]').forEach(e=>e.remove());ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>s.emit('p2h',{t:'pick',d:+b.dataset.i}))}else if(m.t==='ovoff')ov.style.display='none'});
s.on('p2h',m=>{if(m.t==='pick'&&G&&G.state==='pick'&&G.pq&&G.pq[0]&&G.pq[0].id===m.slot)choose(m.d)});
s.on('left',m=>{const p=G&&G.ps&&G.ps[m.slot];if(!p||!net.host)return;p.down=p.gone=true;say(p.name+' left.',120);const cur=G.pq&&G.pq[0]===p;if(G.pq)G.pq=G.pq.filter(x=>x!==p);if(G.state==='pick'&&cur)showPick()});
s.on('toLobby',()=>{net.live=false;net.host=false;G=null;lobbyUI()});
s.on('closed',m=>{net.sock.close();net=null;menu();errMsg(m||'Room closed.')});
s.on('disconnect',r=>{if(net&&r!=='io client disconnect'){net=null;menu();errMsg('Lost connection.')}})}
function lobbyUI(){const L=net&&net.lobby;if(!L)return;const me=L.players.find(p=>p.id===net.id),host=L.hostId===net.id;ov.style.display='flex';
ov.innerHTML=`<small>Room code. Friends type this.</small><div class=code>${L.code}</div><small>${L.players.length}/8 players</small>`+L.players.map(p=>`<div class=pl><b>${p.name}${p.host||p.id===L.hostId?' (host)':''}</b><span style="color:${CL[p.cls].col}">${p.cls}</span><span>${p.id===L.hostId||p.ready?'ready':'...'}</span></div>`).join('')+`<div class=row>${Object.keys(CL).map(c=>`<button class="cs ${me&&me.cls==c?'on':''}" data-c=${c}>${c}</button>`).join('')}</div><div class=row>${host?'<button id=st2 class=big>Start run</button>':'<button id=rd>Ready / not ready</button>'}<button id=lv>Leave</button></div><div id=err></div>`;
ov.querySelectorAll('.cs').forEach(b=>b.onclick=()=>net.sock.emit('setClass',b.dataset.c));
document.getElementById('lv').onclick=()=>{net.sock.close();net=null;menu()};
const rd=document.getElementById('rd');if(rd)rd.onclick=()=>net.sock.emit('ready',!(me&&me.ready));
const st=document.getElementById('st2');if(st)st.onclick=()=>net.sock.emit('start',null,r=>{if(r&&r.err)errMsg(r.err)})}
setInterval(()=>{if(!net||!net.live)return;if(net.host){if(G&&G.ps&&G.ps.length)net.sock.volatile.emit('snap',snap())}else net.sock.emit('input',enc(myKeys()))},50);
let last=0,acc=0;function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){if(G&&G.state==='play')update();acc-=16.67}try{draw()}catch(e){}requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});menu();
</script></body></html>
