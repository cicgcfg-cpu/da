app = "chaos-descent"        # change: must be unique on Fly
primary_region = "sin"       # Singapore. Pick region near your players.

[build]

[env]
  PORT = "8080"

# Rooms live in server memory. Keep exactly ONE machine, never auto-stop.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
